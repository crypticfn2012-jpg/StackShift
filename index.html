<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stack Shift</title>
<link rel="icon" type="image/png" href="./favicon.png">
<meta name="theme-color" content="#14213f">
<style>
:root{--bg:#26395f;--bg2:#1a2748;--navy:#14213f;--cream:#fbf0d4;--paper:#f4e3b8;--ink:#14213f;--or:#f5862a;--ok:#2f8a55;--bad:#c8382b;--gbg:#ead9b5;--gln:#cdb98d;--u:56px;--f:"Arial Rounded MT Bold","Avenir Next Rounded",Nunito,"Trebuchet MS",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b2845;--bg2:#101a33}}
:root[data-theme=dark]{--bg:#1b2845;--bg2:#101a33}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--cream);background:var(--bg2) radial-gradient(130% 80% at 50% 0,var(--bg),var(--bg2)) fixed;font:800 16px/1.3 var(--f);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#app{max-width:620px;margin:0 auto;padding:12px 10px 6px}
.hide{display:none!important}
.scr{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.ttl{font:900 clamp(56px,19vw,92px)/.9 var(--f);margin:10px 0 20px;color:var(--cream);-webkit-text-stroke:8px var(--navy);paint-order:stroke fill;text-shadow:0 7px 0 var(--navy);transform:rotate(-3deg);letter-spacing:-1px}
.ttl span{display:block;color:var(--or);margin-left:.4em}
.tag{margin:8px 0 0;max-width:18em;color:#e9dcc0;font-weight:700}
#road{position:relative;height:178px;margin:0 -10px;background:linear-gradient(transparent 150px,#171a28 150px)}
#road::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:4px;background:repeating-linear-gradient(90deg,#e9dcc0 0 26px,transparent 26px 52px)}
#mvan{position:absolute;left:50%;bottom:14px;width:240px;margin-left:-120px;animation:bob 1.1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.van{container-type:inline-size;position:relative}.van img{width:100%;display:block;pointer-events:none}
.dc{position:absolute;left:17%;top:50%;transform:translate(-50%,-50%);font:900 13cqw/1 var(--f);color:var(--cream);-webkit-text-stroke:3px var(--navy);paint-order:stroke fill}
.b{display:block;width:100%;min-height:50px;margin:12px 0;padding:10px 14px;font:900 18px var(--f);color:var(--ink);background:var(--cream);border:4px solid var(--navy);border-radius:14px;box-shadow:0 6px 0 var(--navy);cursor:pointer;touch-action:manipulation;transition:transform .08s,box-shadow .08s}
.b.pri{background:var(--or)}.b.big{min-height:64px;font-size:25px}
.b:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--navy)}
.b:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
.row{display:flex;gap:12px}.row .b{flex:1}
.dkt{display:flex;margin:18px 0 8px;background:var(--paper);color:var(--ink);border:4px solid var(--navy);border-radius:14px;box-shadow:0 6px 0 var(--navy);overflow:hidden}
.stub{flex:none;width:76px;background:var(--or);border-right:4px dashed var(--navy);display:grid;place-content:center;text-align:center;font:900 14px/1.05 var(--f)}.stub b{font-size:32px;display:block}
.dkt .bd{flex:1;padding:10px 12px 12px}.dkt p{margin:3px 0;font-weight:700;font-size:15px}
.dkt .bd::after{content:"";display:block;height:9px;margin-top:8px;background:repeating-linear-gradient(90deg,var(--navy) 0 2px,transparent 2px 5px,var(--navy) 5px 6px,transparent 6px 9px)}
.dkt .b{min-height:42px;font-size:16px;margin:8px 0 0;box-shadow:0 4px 0 var(--navy)}
.rec{font-size:14px;color:#d6cbb0;font-weight:700;margin:14px 0}
#hud{display:flex;align-items:center;gap:10px;position:relative}
.sb{line-height:1;min-width:72px}.sb small{display:block;font-size:12px;color:#d6cbb0}#sc{font:900 34px/1 var(--f);display:block}
#sc.pop,#st.pop{animation:pop .25s}@keyframes pop{50%{transform:scale(1.25)}}
.tmw{flex:1;height:30px;background:var(--cream);border:4px solid var(--navy);border-radius:999px;position:relative;overflow:hidden}
#bar{height:100%;background:var(--or);border-right:4px solid var(--navy)}
#tm{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink);font-size:15px}
#st{min-width:84px;text-align:right;color:var(--or);font-size:15px;text-shadow:0 2px 0 var(--navy)}
.ib{width:46px;height:46px;flex:none;border:4px solid var(--navy);background:var(--cream);color:var(--ink);border-radius:50%;font:900 15px var(--f);cursor:pointer;box-shadow:0 4px 0 var(--navy)}
#ord{display:flex;align-items:center;gap:10px;margin:12px 0 4px;padding:6px 10px;background:var(--paper);color:var(--ink);border:4px solid var(--navy);border-radius:12px;overflow:hidden}
#ord .van{width:64px;flex:none}.van.go{animation:drive .5s}
#contract{display:flex;align-items:center;gap:10px;margin:8px 0;padding:9px 12px;background:rgba(251,240,212,.09);border:1px solid rgba(251,240,212,.22);border-radius:12px;color:var(--cream)}#contract .mark{flex:none;width:34px;height:34px;display:grid;place-items:center;background:var(--or);color:var(--navy);border-radius:9px;font-size:20px}#contract .copy{flex:1;min-width:0}#contract b{display:block;font-size:13px}#contract small{display:block;color:#d6cbb0;font-size:12px;font-weight:700}#contract .progress{height:5px;margin-top:6px;background:rgba(251,240,212,.18);border-radius:9px;overflow:hidden}#contract .progress i{display:block;height:100%;background:var(--or);width:0;transition:width .2s}
@keyframes drive{45%{transform:translateX(150%)}46%{transform:translateX(-150%)}}
#rl{flex:1;font-size:15px}#on{font-size:12px;color:#5a5048;display:block;text-align:right}
.lnk{background:none;border:0;color:var(--ink);font:800 13px var(--f);text-decoration:underline;cursor:pointer;padding:6px}
#tut{font-size:14px;color:#e9dcc0;margin:6px 0 0;font-weight:700}#tut .lnk{color:var(--or)}
#stage{position:relative;width:100%;margin:18px 0 6px;touch-action:none}
#stage.sw{animation:sw .2s}@keyframes sw{from{opacity:.2;transform:translateX(14px)}}
#board{position:absolute;top:0;display:grid;background:var(--gbg);border-radius:6px;box-shadow:inset 0 8px 0 rgba(20,33,63,.14);transition:left .2s}
#board::after{content:"";position:absolute;inset:-6px;border:6px solid var(--navy);border-radius:14px;pointer-events:none}
#board[data-e=left]::after{border-left-color:var(--or)}#board[data-e=right]::after{border-right-color:var(--or)}#board[data-e=top]::after{border-top-color:var(--or)}#board[data-e=bottom]::after{border-bottom-color:var(--or)}
#board.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.g{border:1px solid var(--gln);box-sizing:border-box}
.g.ok{background:rgba(47,138,85,.42);box-shadow:inset 0 0 0 3px var(--ok)}
.g.bad{background:repeating-linear-gradient(135deg,rgba(200,56,43,.55) 0 4px,transparent 4px 9px);box-shadow:inset 0 0 0 3px var(--bad)}
.pc{position:absolute;left:0;top:0;transform-origin:0 0;touch-action:none;cursor:grab;transition:transform .14s cubic-bezier(.2,.8,.3,1)}
.pc.lift{transition:none;z-index:5;filter:drop-shadow(0 9px 5px rgba(0,0,0,.35));cursor:grabbing}
.c{position:absolute;width:var(--u);height:var(--u);box-sizing:border-box;display:grid;place-items:center;font-size:calc(var(--u)*.38);color:var(--navy);border:0 solid var(--navy);background-image:linear-gradient(rgba(20,33,63,.09) 1px,transparent 1px);background-size:100% 8px}
.c.t::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:24%;transform:translateX(-50%);background:rgba(255,248,225,.42)}
.fl{position:absolute;left:50%;top:30%;font:900 32px var(--f);color:var(--or);-webkit-text-stroke:5px var(--navy);paint-order:stroke fill;animation:fl .9s forwards;pointer-events:none;z-index:9;transform:translateX(-50%);white-space:nowrap}
@keyframes fl{to{transform:translate(-50%,-60px);opacity:0}}
.cf{position:fixed;width:9px;height:9px;z-index:30;animation:cf .7s ease-out forwards;pointer-events:none}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
#board.bump{animation:bump .18s}@keyframes bump{40%{transform:translateY(4px) scale(1.012)}}
.g.hit{animation:hit .28s}@keyframes hit{from{background:#fff;box-shadow:inset 0 0 0 3px var(--or)}}
.pc.out{pointer-events:none;animation:out .3s ease-in forwards}@keyframes out{to{opacity:0;top:-40px}}
.sp{position:absolute;width:9px;height:9px;box-sizing:border-box;border:2px solid var(--navy);border-radius:2px;pointer-events:none;z-index:8;animation:sp .6s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}}
.fl small{display:block;font-size:14px;text-align:center;-webkit-text-stroke:4px var(--navy)}
.tb{position:absolute;right:calc(50% - 40px);top:40px;font:900 22px var(--f);color:var(--cream);-webkit-text-stroke:5px var(--navy);paint-order:stroke fill;animation:tb .9s forwards;pointer-events:none;z-index:9}
@keyframes tb{to{transform:translateY(-14px);opacity:0}}
.tmw.gain{animation:gain .45s}@keyframes gain{40%{transform:scale(1.06);background:#fff}}
.tmw.low{animation:lowp .45s ease-in-out infinite alternate}.tmw.low #bar{background:var(--bad)}@keyframes lowp{to{transform:scale(1.03)}}
#dl.rdy:not(:disabled){animation:rdy .6s ease-in-out infinite alternate}@keyframes rdy{to{transform:translateY(-3px);box-shadow:0 9px 0 var(--navy)}}
#acts{position:sticky;bottom:0;display:flex;gap:10px;padding:10px 0 12px;background:linear-gradient(transparent,var(--bg2) 35%)}
#acts .b{margin:0;min-height:54px;font-size:17px;flex:1}#dl{flex:1.7!important}
#ov{position:fixed;inset:0;background:rgba(10,16,32,.78);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
#ov .card{width:100%;max-width:390px;background:var(--paper);color:var(--ink);border:5px solid var(--navy);border-radius:18px;padding:18px;box-shadow:0 8px 0 #0a1022}
#ov .card.cosmetics-card{width:min(760px,calc(100vw - 32px));max-width:760px;max-height:calc(100dvh - 32px);overflow-y:auto;overscroll-behavior:contain;padding:22px}
#ov .cosmetics-card .chips{gap:10px}
#ov .cosmetics-card .chip{min-width:120px;flex:1 1 135px}
@media(max-width:520px){#ov .card.cosmetics-card{width:calc(100vw - 20px);max-height:calc(100dvh - 20px);padding:14px}#ov .cosmetics-card .chip{flex:1 1 calc(50% - 10px);min-width:0}}
#ov .b{margin:10px 0}
h2{font:900 28px/1.05 var(--f);margin:0 0 10px;letter-spacing:-.5px}h3{font-size:14px;margin:12px 0 6px}
.sub{color:#5a5048;margin:4px 0 12px;font-weight:700}
.big{font:900 68px/1 var(--f);color:var(--or);-webkit-text-stroke:6px var(--navy);paint-order:stroke fill;text-shadow:0 5px 0 var(--navy)}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.st div{background:var(--cream);border:3px solid var(--navy);border-radius:10px;padding:6px 10px}.st b{display:block;font-size:24px}.st span{font-size:12px;color:#5a5048}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font:800 14px var(--f);padding:6px 10px;background:var(--cream);color:var(--ink);border:3px solid var(--navy);border-radius:10px;cursor:pointer;text-align:left}.chip small{display:block;font-weight:700;color:#5a5048}.chip.on{background:var(--or)}.chip.on small{color:var(--ink)}
#ov .van{width:160px;margin:0 auto}.sw{display:flex;gap:6px;padding:8px;border:4px solid;border-radius:10px;margin:8px 0}.sw i{flex:1;height:26px;border:3px solid var(--navy);border-radius:5px;display:block}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--cream);color:var(--ink);border:3px solid var(--navy);padding:8px 14px;border-radius:12px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:40;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.rm *,.rm *::before,.rm *::after{animation:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* Compact responsive menu and branded startup splash */
#menu .mode-row{margin:5px 0 8px;gap:10px}#menu .mode-row .b{margin:5px 0;min-height:54px;padding:8px;font-size:19px}
#boot{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;padding:24px;transition:opacity .4s,visibility .4s}
#boot.done{opacity:0;visibility:hidden;pointer-events:none}
.boot-inner{width:min(390px,88vw);text-align:center}
.boot-logo{display:block;width:min(330px,78vw);margin:0 auto 28px}
.boot-track{height:5px;border-radius:8px;background:#1c2941;overflow:hidden}
#bootBar{height:100%;width:4%;background:linear-gradient(90deg,#0789ff,#16b7ff);border-radius:8px;transition:width .18s}
.boot-caption{font:800 10px/1.3 system-ui,sans-serif;letter-spacing:.17em;color:#91a2bf;margin-top:12px;text-transform:uppercase}
@media(max-height:780px){#app{padding-top:5px;padding-bottom:3px}.ttl{font-size:clamp(48px,12vw,70px);margin:4px 0 14px}.tag{margin:7px 0}#road{height:112px}#mvan{width:190px;margin-left:-95px}.b{margin:7px 0;min-height:44px;padding:8px 10px}.b.big{min-height:48px;font-size:20px}.dkt{margin:8px 0 5px}.dkt .bd{padding:6px 9px}.dkt p{font-size:12px}.dkt .b{min-height:34px;margin:5px 0}.rec{margin:7px 0;font-size:11px}.mode-row .b{min-height:46px;font-size:17px}}
@media(max-height:640px){.ttl{font-size:48px}.tag{font-size:13px}#road{height:86px}#mvan{width:160px;margin-left:-80px}#road::after{bottom:5px}.dkt .stub{width:60px}.dkt .stub b{font-size:25px}.rec{font-size:10px}.row .b{font-size:15px}}
@media(max-width:390px){.mode-row{gap:7px}.mode-row .b{font-size:16px}}

/* Minimal polish layered onto the original UI. */
.b,.ib,.chip,.lnk{transition:transform .13s ease,filter .13s ease}
.b:hover:not(:disabled),.ib:hover:not(:disabled),.chip:hover:not(:disabled),.lnk:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.06)}
.b:active:not(:disabled),.ib:active:not(:disabled),.chip:active:not(:disabled),.lnk:active:not(:disabled){transform:translateY(1px) scale(.985)}
.b:focus-visible,.ib:focus-visible,.chip:focus-visible,.lnk:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f5862a;outline-offset:3px}

.large-text{font-size:18px}.high-contrast{--bg:#07101f;--bg2:#000;--cream:#fff;--paper:#fff;--ink:#000;--or:#ffbd24;--gbg:#fff;--gln:#555;--ok:#00652c;--bad:#a00020}
.settings-grid{display:grid;gap:8px;text-align:left;margin:10px 0 14px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #ffffff20}
.settings-row span{font-size:14px}.settings-row select{max-width:58%;min-width:125px}.settings-row input[type=range]{width:46%;accent-color:#f5862a}.settings-row input[type=checkbox]{width:19px;height:19px;accent-color:#f5862a}
.settings-note{font-size:12px;opacity:.78;margin:4px 0 12px}.card:has(#settingLang){max-height:88vh;overflow:auto}
.settings-credits{border-top:2px solid #14213f30;margin:10px 0 4px;padding-top:9px;font-size:13px}.settings-credits b{display:block;margin-bottom:4px}.settings-credits p{margin:2px 0;font-weight:700;color:#5a5048}
.ach-list{display:grid;gap:7px;max-height:56vh;overflow-y:auto;margin:10px 0 14px;padding:2px}.ach-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--cream);border:3px solid var(--navy);border-radius:10px}.ach-item.locked{opacity:.65}.ach-mark{width:30px;height:30px;flex:none;display:grid;place-items:center;background:var(--or);border-radius:7px;font-size:17px}.ach-item b{display:block;font-size:14px}.ach-item small{display:block;font-size:12px;line-height:1.25;color:#5a5048}.ach-item .ach-state{font-weight:900;text-transform:uppercase;letter-spacing:.04em;margin-top:3px}.ach-item.active{opacity:1;border-color:var(--or)}.menu-links{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px}.menu-links span{opacity:.55}
@media(prefers-reduced-motion:reduce){.scr{animation:none!important}}

</style></head>
<body>
<div id="boot" aria-label="Loading Stack Shift"><div class="boot-inner">
<svg class="boot-logo" viewBox="0 0 500 330" role="img" aria-label="PixelForge Studios">
<rect width="500" height="330" rx="10" fill="#000"/>
<g transform="translate(95 22)"><path d="M8 112 35 8h125c29 0 43 24 32 48-4 9-14 16-27 20L68 112l-9 34-51 31 16-65Zm40-27 92-31c12-4 16-19 4-19H62Z" fill="#f7f9ff"/><path d="M102 111 242 59h95l-35 34H189l-7 25h104l-31 32H177l-10 34-51 31 23-104Z" fill="#0789ff"/></g>
<text x="250" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="900" fill="#f7f9ff">PIXEL<tspan fill="#0789ff">FORGE</tspan></text><path d="M48 279h57m290 0h57" stroke="#0789ff" stroke-width="4"/><text x="250" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="13" fill="#f7f9ff">STUDIOS</text></svg>
<div class="boot-track"><div id="bootBar"></div></div><div class="boot-caption" id="bootCaption">Preparing your shift</div></div></div>
<main id="app">
<section id="menu" class="scr">
 <h1 class="ttl">Stack<span>Shift</span></h1>
 <p class="tag">Fit every parcel into the van before the clock runs out.</p>
 <div id="road"><div class="van" id="mvan"></div></div>
 <div class="row mode-row"><button class="b pri big" data-a="play">Timed puzzle</button><button class="b big" data-a="endless">Endless mode</button></div>
 <div class="dkt" id="dly"></div>
 <div class="row"><button class="b" data-a="shop">Cosmetics</button><button class="b" data-a="settings">Settings</button><button class="b" data-a="snd" id="snd">Sound: on</button></div>
 <p class="rec" id="rec"></p>
 <p id="achLink" class="rec menu-links"><button class="lnk" data-a="campaign" style="color:var(--or)">Career campaign</button><span>·</span><button class="lnk" data-a="achievements">Achievements</button><span>·</span><button class="lnk" data-a="leaderboard">Daily leaderboard</button></p>
</section>

 <div id="hud"><div class="sb"><small>Score</small><b id="sc" aria-label="Score">0</b></div><div class="tmw" role="timer" aria-label="Time remaining"><div id="bar"></div><span id="tm">90</span></div><span id="st"></span><button class="ib" data-a="pause" aria-label="Pause">II</button></div>

 <p id="tut" class="hide">Drag parcels into the van. Tap one to rotate it, or press R. Space delivers. Fast deliveries add time. <button class="lnk" data-a="skip">Got it</button></p>
 <div id="stage"><div id="board"></div></div>
 <div id="acts"><button class="b" data-a="clr">Reset</button><button class="b" id="rt" data-a="rot">Rotate</button><button class="b pri" id="dl" data-a="dlv" disabled>Deliver</button></div>

</main>

<script>

 const put=(sel,key)=>{const e=$(sel);if(e)e.textContent=L(key)};
 put('#menu .tag','tagline');put('#menu [data-a=play]','timed');put('#menu [data-a=endless]','endless');put('#menu [data-a=shop]','cosmetics');put('#menu [data-a=settings]','settings');put('#menu [data-a=snd]',muted()?'soundOff':'soundOn');
 put('#acts [data-a=clr]','reset');put('#acts [data-a=rot]','rotate');put('#acts [data-a=dlv]','deliver');put('#ord [data-a=nxt]','skip');
 put('#contractTitle',G&&G.contract?G.contract.titleKey?L(G.contract.titleKey):G.contract.title:'shiftContract');
 if($('#contractDesc')&&G&&G.contract&&!G.contractPaid)$('#contractDesc').textContent=G.contract.descKey?L(G.contract.descKey):G.contract.desc;
 const tut=$('#tut');if(tut){const b=tut.querySelector('[data-a=skip]');if(b)b.textContent=L('gotIt')}
 const h=$('#hud .sb small');if(h)h.textContent=L('score');
}
function settings(){const options=LANG_OPTIONS.map(x=>'<option value="'+x[0]+'" '+(S.lang===x[0]?'selected':'')+'>'+x[1]+'</option>').join('');
 ov('<h2>'+L('settings')+'</h2><div class="settings-grid">'+
 '<label class="settings-row"><span>'+L('language')+'</span><select id="settingLang" aria-label="'+L('language')+'">'+options+'</select></label>'+
 '<label class="settings-row"><span>'+L('volume')+' <b id="volumeVal">'+Math.round(S.volume??80)+'%</b></span><input id="settingVolume" type="range" min="0" max="100" step="5" value="'+(S.volume??80)+'" aria-label="'+L('volume')+'"></label>'+
 '<label class="settings-row"><span>'+L('sound')+'</span><input id="settingMute" type="checkbox" '+(!S.mute?'checked':'')+' aria-label="'+L('sound')+'"></label>'+
 '<label class="settings-row"><span>'+L('hoverSounds')+'</span><input id="settingHover" type="checkbox" '+(S.hoverSound?'checked':'')+' aria-label="'+L('hoverSounds')+'"></label>'+
 '<label class="settings-row"><span>'+L('reducedMotion')+'</span><input id="settingMotion" type="checkbox" '+(S.rm?'checked':'')+' aria-label="'+L('reducedMotion')+'"></label>'+
 '<label class="settings-row"><span>'+L('largeText')+'</span><input id="settingText" type="checkbox" '+(S.largeText?'checked':'')+' aria-label="'+L('largeText')+'"></label>'+
 '<label class="settings-row"><span>'+L('highContrast')+'</span><input id="settingContrast" type="checkbox" '+(S.hc?'checked':'')+' aria-label="'+L('highContrast')+'"></label></div>'+
 '<p class="settings-note">'+L('savedAuto')+'</p><div class="settings-credits"><b>Credits</b><p>Main developer: Ron</p><p>Studio: PixelForge Studios</p></div><button class="b pri" data-a="settingsClose">'+L('close')+'</button>')}

function menu(){const dly=S.daily.d===utc(),dt=new Date(),locale=(LANGS.find(l=>l.id===S.lang)||LANGS[0]||{}).locale||'en-GB',ds=S.dailyStreak||{best:0};
 $('#dly').innerHTML=`<div class="stub">${dt.toLocaleString(locale,{month:'short',timeZone:'UTC'})}<b>${dt.getUTCDate()}</b>${L('daily')}</div><div class="bd"><b style="font-size:18px">${L('daily')}</b><p>${L('dailyBlurb').replace('{n}',DN)} ${L('sameToday')}</p><p>${dly&&S.daily.done?L('completed')+' ✓ · '+L('best')+' '+S.daily.best:dly?L('attempted')+' · '+L('best')+' '+S.daily.best:L('notAttempted')} · Day streak ${dailyStreakNow()} · Best streak ${ds.best||0}</p><p class="sub">Streak reward: +50 coins at 3 days, +100 every 7 days.</p><button class="b pri" data-a="daily">${L('playDaily')}</button></div>`;
 const played=Math.floor(S.playtime&&S.playtime.seconds||0),next=nextPlaytimeReward();
 set('#rec',`${L('best')} ${S.best} · ${S.orders} ${L('orders')} · ${S.perfect} ${L('perfect')} · ${L('streak')} ${S.streak} · ${S.shifts} ${L('shifts')} · ${S.coins} ${L('coins')} · ${formatDuration(played)} played · next +${next.coins} in ${formatDuration(Math.max(0,next.seconds-played))}`);set('#snd',L(muted()?'soundOff':'soundOn'));show('menu');applyLanguage()}
function toMenu(){if(G&&G.run){G.run=false;SDK.gx()}cl();menu()}
function shop(pv){const eq=Object.assign({},S.eq),it=pv&&cat(pv);if(it)eq[it[0]]=pv;const g=cat(eq.grd)[4],p=cat(eq.pal)[4];
 let h=`<h2>${L('cosmetics')}</h2><p class="sub">${S.coins} ${L('coins')} · ${L('earnedByPlaying')}</p><div class="van"></div><div class="sw" style="background:${g[0]};border-color:${g[1]}">${p.map(c=>`<i style="background:${c}"></i>`).join('')}</div>`;
 for(const[k,n]of[['van',L('vanPaint')],['pal',L('parcelColors')],['grd',L('cargoFloor')],['dec',L('decal')]])h+=`<h3>${n}</h3><div class="chips">`+C.filter(c=>c[0]===k).map(c=>`<button class="chip${c[1]===eq[k]?' on':''}" data-a="pick" data-id="${c[1]}">${c[2]}<small>${S.own.includes(c[1])?(S.eq[k]===c[1]?L('equipped'):L('owned')):c[3]+' '+L('coins')}</small></button>`).join('')+'</div>';
 if(it){const own=S.own.includes(it[1]);h+=own?`<button class="b pri" data-a="eq" data-id="${it[1]}" ${S.eq[it[0]]===it[1]?'disabled':''}>${S.eq[it[0]]===it[1]?L('equipped'):L('equip')+' '+it[2]}</button>`:`<button class="b pri" data-a="buy" data-id="${it[1]}" ${S.coins<it[3]?'disabled':''}>${L('buy')} ${it[2]} · ${it[3]} ${L('coins')}</button>`}
 ov(h+'<button class="b" data-a="done">'+L('done')+'</button>');$('#ov .card').classList.add('cosmetics-card');applyTheme(eq)}
const A={play:()=>start(0),settings:()=>{settingsBack=!!(G&&G.run&&G.paused);settings()},settingsClose:()=>{cl();applySettings();applyLanguage();if(settingsBack&&G&&G.run&&G.paused){settingsBack=false;pcard()}else{settingsBack=false;menu()}},daily:()=>start(1),endless:()=>start(0,true),again:()=>start(G.daily,G.endless),again0:()=>start(G.daily,G.endless),menu:toMenu,copy:b=>copy(b),campaign:campaign,campaignClose:()=>{cl();menu()},leaderboard:leaderboard,leaderboardClose:()=>{cl();menu()},shop:()=>shop(),pick:b=>shop(b.dataset.id),
 buy:b=>{const it=cat(b.dataset.id);if(S.coins>=it[3]&&!S.own.includes(it[1])){S.coins-=it[3];S.own.push(it[1]);S.eq[it[0]]=it[1];save();toast(it[2]+' unlocked');sfx('buy')}shop(it[1])},
 eq:b=>{const it=cat(b.dataset.id);if(S.own.includes(it[1])){S.eq[it[0]]=it[1];save()}shop(it[1])},
 done:()=>{applyTheme(S.eq);cl();menu()},achievements:()=>achievements(),achClose:()=>{cl();menu()},snd:()=>{S.mute=!S.mute;save();menu();if(G&&G.paused)pcard()},
 rmt:()=>{S.rm=!S.rm;save();document.documentElement.classList.toggle('rm',RM());pcard()},pause:()=>pause(),resume:()=>pause(),rot:rotSel,dlv:deliver,nxt:skip,clr:reset,
 skip:()=>{S.seen=true;save();$('#tut').classList.add('hide')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){if(!['rot','dlv','clr','nxt','buy'].includes(b.dataset.a))sfx('ui');A[b.dataset.a](b)}});
let hoverButton=null,lastHoverSound=0;
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const target=e.target;if(!target||typeof target.closest!=='function')return;const b=target.closest('.b,.ib,.chip,.lnk');if(!b||b===hoverButton||(e.relatedTarget&&b.contains(e.relatedTarget)))return;hoverButton=b;if(S.hoverSound&&!muted()&&Date.now()-lastHoverSound>120){lastHoverSound=Date.now();sfx('hover')}},true);
document.addEventListener('pointerout',e=>{const target=e.target;if(!target||typeof target.closest!=='function')return;const b=target.closest('.b,.ib,.chip,.lnk');if(!b)return;if(b===hoverButton&&(!e.relatedTarget||!b.contains(e.relatedTarget)))hoverButton=null},true);
document.addEventListener('input',e=>{if(e.target.id!=='settingVolume')return;S.volume=Number(e.target.value);const v=$('#volumeVal');if(v)v.textContent=S.volume+'%';applySettings();save()});
document.addEventListener('change',e=>{const t=e.target;if(!t)return;if(t.id==='settingLang')S.lang=t.value;else if(t.id==='settingMute')S.mute=!t.checked;else if(t.id==='settingHover')S.hoverSound=t.checked;else if(t.id==='settingMotion')S.rm=t.checked;else if(t.id==='settingText')S.largeText=t.checked;else if(t.id==='settingContrast')S.hc=t.checked;else return;save();applySettings();applyLanguage();if(G&&G.contract)updateContract();if(t.id==='settingLang'){settings();$('#settingLang')?.focus()}});

addEventListener('keydown',e=>{if(!G||!G.run)return;if(e.key==='Escape'){pause();return}if(G.paused)return;
 if(e.key==='r'||e.key==='R'){rotSel();e.preventDefault()}else if(e.key===' '||e.key==='Enter'){e.preventDefault();deliver()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.run&&!G.paused)pause(true)});
addEventListener('resize',size);
let last=0;function frame(ts){const dt=Math.min(.1,(ts-last)/1e3||0);last=ts;trackPlaytime(dt);
 if(G&&G.run&&!G.paused){if(!G.endless)G.t-=dt;G.os+=dt;G.el+=dt;hud();if(!G.endless&&G.t<=0){G.t=0;hud();end()}}requestAnimationFrame(frame)}
/* ===== boot ===== */
const bootBar=$('#bootBar');let bootP=4;const bootTimer=setInterval(()=>{bootP=Math.min(88,bootP+Math.random()*7+2);bootBar.style.width=bootP+'%'},180);
(async()=>{await SDK.init();S=load();save();applyTheme(S.eq);applySettings();size();menu();SDK.loaded();requestAnimationFrame(frame);clearInterval(bootTimer);bootBar.style.width='100%';$('#bootCaption').textContent='Ready to stack';setTimeout(()=>$('#boot').classList.add('done'),420)})();

</script></body></html>
