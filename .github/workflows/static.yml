# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate game script and achievements
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';

          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter((match) => !/\bsrc\s*=/i.test(match[1]) && match[2].trim());

          if (scripts.length !== 1) {
            throw new Error(`Expected one inline game script; found ${scripts.length}`);
          }

          const source = scripts[0][2];
          new vm.Script(source, { filename: 'index.html:inline-game-script' });

          // Smoke-test the real puzzle generator independently of the browser DOM.
          const generatorStart = source.indexOf('const rng=');
          const generatorEnd = source.indexOf('/* ===== cosmetics ===== */', generatorStart);
          if (generatorStart < 0 || generatorEnd < 0) throw new Error('Puzzle generator section is missing');
          const generatorContext = {};
          vm.runInNewContext(
            source.slice(generatorStart, generatorEnd) + '\\nglobalThis.__api = { gen, verify, dims, GR };',
            generatorContext,
            { timeout: 10000 }
          );
          const api = generatorContext.__api;
          let generated = 0;
          for (const seed of [1, 113, 2026]) {
            for (let difficulty = 0; difficulty < api.GR.length; difficulty++) {
              for (let order = 0; order < 6; order++) {
                const puzzle = api.gen(seed, order, difficulty);
                if (!puzzle || !Array.isArray(puzzle.ps) || puzzle.ps.length === 0) {
                  throw new Error('Generator returned an empty puzzle');
                }
                if (!api.verify(puzzle)) throw new Error('Generated solution overlaps or violates its rule');
                const used = new Set();
                for (const piece of puzzle.ps) {
                  if (!Array.isArray(piece.cells) || piece.cells.length === 0) throw new Error('Generated parcel has no cells');
                  const [width, height] = api.dims(piece.cells);
                  const shape = new Set(piece.cells.map(([x, y]) => x + ',' + y));
                  if (shape.size !== piece.cells.length) throw new Error('Generated parcel contains duplicate cells');
                  for (const [x, y] of piece.cells) {
                    if (!Number.isInteger(x) || !Number.isInteger(y) || x < 0 || y < 0 || x >= width || y >= height) {
                      throw new Error('Generated parcel has invalid local coordinates');
                    }
                  }
                  for (const [x, y] of piece.sol) {
                    const cell = (y + piece.sy) * puzzle.c + x + piece.sx;
                    if (used.has(cell)) throw new Error('Generated solution has overlapping parcels');
                    used.add(cell);
                  }
                }
                generated++;
              }
            }
          }

          const start = source.indexOf('const AL=[');
          const end = source.indexOf('];\nfunction ach()', start);
          if (start < 0 || end < 0) throw new Error('Achievement catalog is missing');

          const ids = [...source.slice(start, end).matchAll(/\['([^']+)'/g)].map((m) => m[1]);
          if (ids.length < 50) throw new Error(`Expected at least 50 achievements; found ${ids.length}`);
          if (new Set(ids).size !== ids.length) throw new Error('Achievement IDs must be unique');

          for (const required of [
            'adFinished:()=>',
            'adError:error=>',
            'reportGameCompletedPercentage',
            'dailyCompletions:0'
          ]) {
            if (!source.includes(required)) throw new Error(`Missing expected integration: ${required}`);
          }

          console.log(`Validated game JavaScript, ${generated} generated puzzles, ${ids.length} unique achievements, CrazyGames callbacks and progression saves.`);
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
